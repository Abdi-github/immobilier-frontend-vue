# =============================================
# DOCKER COMPOSE — Immobilier Frontend Vue (Prod)
# =============================================
# Usage: docker compose -f docker-compose.prod.yml up --build -d
# =============================================

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://api.immobilier.ch/api/v1}
        - VITE_APP_NAME=${VITE_APP_NAME:-Immobilier.ch}
        - VITE_APP_VERSION=${VITE_APP_VERSION:-1.0.0}
        - VITE_DEFAULT_LANGUAGE=${VITE_DEFAULT_LANGUAGE:-en}
        - VITE_CLOUDINARY_CLOUD_NAME=${VITE_CLOUDINARY_CLOUD_NAME:-dzyyygr1x}
    container_name: immobilier_frontend_vue_prod
    restart: unless-stopped
    ports:
      - "3000:8080"
    networks:
      - immobilier_network

networks:
  immobilier_network:
    external: true
    name: immobilier_network
